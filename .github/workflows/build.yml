name: build
on: [push, pull_request]
jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            postgres-version: 19
            # track-origins: no
            # check-ub: yes
            asan: yes
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          repository: pgvector/pgvector
          ref: ci13

      - uses: actions/checkout@v7
        with:
          path: action
      - uses: ./action
        with:
          postgres-version: ${{ matrix.postgres-version }}
          # track-origins: ${{ matrix.track-origins }}
          # check-ub: ${{ matrix.check-ub }}
          asan: ${{ matrix.asan }}

      - run: make OPTFLAGS=""
      - run: sudo --preserve-env=PG_CONFIG,ASAN_OPTIONS make install
      - run: make installcheck
      - run: make prove_installcheck PROVE_TESTS=test/t/015_hnsw_vector_duplicates.pl
