name: build
on: [push, pull_request]
jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            postgres-version: 17
            track-origins: no
            check-ub: yes
    steps:
      - uses: actions/checkout@v4
        with:
          repository: pgvector/pgvector

      - uses: actions/checkout@v4
        with:
          path: action
      - uses: ./action
        with:
          postgres-version: ${{ matrix.postgres-version }}
          track-origins: ${{ matrix.track-origins }}
          check-ub: ${{ matrix.check-ub }}

      - run: make OPTFLAGS=""
      - run: sudo --preserve-env=PG_CONFIG make install
      - run: make installcheck
      - run: make prove_installcheck PROVE_TESTS=test/t/015_hnsw_vector_duplicates.pl
